local_costmap:
  global_frame: odom
  robot_base_frame: base_link

  update_frequency: 7.0   # 2026-07-27 5→10: 配合高程图 10Hz 发布, 全链延迟 -0.1s
  publish_frequency: 1.0
  transform_tolerance: 0.5
  always_send_full_costmap: false

  static_map: false
  rolling_window: true
  width: 24.0
  height: 24.0
  resolution: 0.10

  # 与视觉版(subject1_local_costmap_vision.yaml)唯一差别：
  # 快照层订阅雷达高程图适配节点的 /r300_lidar/obstacle_scan。
  plugins:
    - {name: lidar_snapshot_layer,
       type: "r300_1x_navigation/VisionSnapshotLayer"}
    - {name: inflation_layer,
       type: "costmap_2d::InflationLayer"}

  lidar_snapshot_layer:
    enabled: true
    topic: /r300_lidar/obstacle_scan

    # 每个独立障碍自最后一次匹配观测起保持 3 秒（TTL 过期清除，无 raytrace）。
    hold_time_s: 3.0    # 2026-07-29 0.1→3.0: 0.1s是位姿冻结事故期间为清"甩尾环"临时砍的,
                        # 该根因已由indoor_test_mode修复。TTL过短=近盲区失忆(车头0.5~1m雷达
                        # 打不到, 障碍从costmap蒸发→检测到仍碰撞)+转弯侧扫无记忆。
                        # 3.0=原设计值, 覆盖近盲区; 代价是行人拖尾~3s

    # 保持逻辑由每个障碍自己的 TTL 负责，不因短时断流提前清空。
    expected_update_rate_s: 1.0  # 2026-07-29审计: 0=断流保险彻底关闭(源码证实stop_on_stale只标current_不清图)
    stop_on_stale: true          # 适配节点整个挂死时: scan断流1s→current_=false→move_base停车,
                                 # 否则TTL 3s后障碍全清+车按最后限速2.0盲开(审计发现的真隐患)

    max_message_age_s: 1.0   # 2026-07-30 0.5→1.0(审查P0): scan 改以位姿采样时刻打戳后,
                             #  名义消息龄=TF龄+numpy处理≈0.15~0.5s, 0.5 会在正常工况
                             #  间歇静默丢帧。新鲜度把关已前移到适配节点(TF龄>0.35s 即
                             #  停发+限速); TTL/hold 记账用接收时刻, 放宽不影响 3s 保持语义
    transform_timeout_s: 0.10

    min_range_m: 0.20
    max_range_m: 10.0
    dedup_resolution_m: 0.05

    # 同一帧中，距离小于该值的几何点聚为同一个障碍。
    cluster_tolerance_m: 0.45  # 2026-07-29 回退0.25→0.45: 0.25在高速下与关联距离共同导致轨迹碎裂

    # 新障碍簇与旧轨迹质心距离小于该值时，认为是同一个障碍。
    association_distance_m: 0.50  # 2026-07-29 回退0.30→0.50: 2m/s×(1/7.6Hz)=0.26m/帧≈0.30上限,
                                  # 提速即关联失败→每帧新建轨迹×TTL3s=障碍重影拖尾

    min_cluster_points: 1   # 2026-07-29 深夜回退 2→1(对抗性审查 P0-2): 单高程格(4cm)障碍的所有
                            # 束命中同一格心, dedup 0.05 后只剩 1 点, =2 会把 ≤12cm 细障碍
                            # (钢筋/标桩/凳腿)整簇丢弃→全链盲; 噪声已有 pos_confirm=2 +
                            # edge_erosion=3 双保险, 三重过滤属冗余

    publish_active_scan: true
    active_scan_topic: /r300_lidar/active_obstacle_scan
    active_scan_frame: base_link
    active_scan_angle_increment_deg: 0.50

  inflation_layer:
    enabled: true
    inflation_radius: 1.0   # 2026-07-29审计: 0.65时车角(外接圆0.57)外软代价带仅8cm且边缘138跳崖到0;
                            # 1.0边缘代价69渐变, 2m/s制动包络1.4m覆盖率翻倍  # 室外基准。硬下限=内切半径0.35(车半宽): 低于它连"必撞环"都画不全,
                            # 细障碍会从footprint采样缝漏过(现场曾设0.25已纠正)。室内档在launch里覆盖为0.45
    cost_scaling_factor: 2.0  # 2026-07-29 3.0→2.0: 膨胀衰减放缓, 外圈软代价更高,
                              # DWA更不愿切入膨胀区(补偿致命标记天生偏小: 4cm格+侵蚀缩边)
