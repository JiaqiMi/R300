# 雷达高程图避障版 DWA（由 subject1_dwa_vision.yaml 派生，仅改最高速度）：
# 高程图链路端到端延迟约 1.0~1.8s（含卡尔曼平滑），负障碍再加 0.6s 去抖；
# 2.5m/s 下反应+制动距离会超过坑的可探测距离，故先压到 1.5m/s。
# 后续加 /cloud_registered_body 快反层验证后可逐步回调。
DWAPlannerROS:
  odom_topic: /subject1/dwa_odom

  # ---------------- 速度限制 ----------------
  # 仅作为开阔区域最高速度。
  max_vel_x: 2.00   # 2026-07-30 1.5→2.0 操作员决定: 关闭限速器执行(speed_limit_apply_to_dwa:=false)
                    # 直接以静态上限跑 2.0。此时负障碍/未验证地面【无降速保护】, 仅 DWA 对已标记
                    # 障碍绕行/拦停(标记距离4~7m, 2.0急停需~2m, 账勉强闭合; 制动实测2.18m/s²)。
                    # 室内档仍被 launch 覆盖 0.8; 重开限速器后本值只是初值
  min_vel_x: 0.00   # 2026-07-30 -0.2→0: 实测DWA会选择长距离倒车去后方目标——
                    # 车尾零实时感知+记忆20s过期+限速器只验证车头方向, 倒车导航=盲开。
                    # 传感不对称→运动不对称: 常规导航禁倒车, 倒车只属于自动脱困反射
                    # (那里有"车尾走廊已验证地面"的正向证据标准+0.4m限量)

  max_vel_y: 0.00
  min_vel_y: 0.00

  max_vel_trans: 2.00
  min_vel_trans: 0.20  # 2026-07-30 0.10→0.20(全参数审查): 实测死区≈0.2m/s, 0.10~0.20 仍是
                       # "指令在发轮子不转"的假指令区, 上次修复只走了半程。
                       # 关系链: 死区(0.2) ≤ min_vel_trans(0.20) ≤ trans_stopped_vel(0.25)

  # 只有实车可以稳定达到时才使用0.45。
  max_vel_theta: 0.75
  min_vel_theta: 0.2  # 2026-07-29 0.3->0.2: 原地精细对准不再一顿一顿
                         # 低于底盘静摩擦死区; 0.30起步立竿见影

  # ---------------- 真实动力学 ----------------
  # 2026-07-30 实车实测验证: 1.5m/s 急停拟合减速度 2.18m/s² ≥ 2.0,
  # 本值从"假设"转为"实测支撑"(brake_test.sh; 限速器 brake_acc=1.74=实测×0.8)。
  acc_lim_x: 2.00
  acc_lim_y: 0.00
  acc_lim_trans: 2.00
  acc_lim_theta: 2.00

  # ---------------- 到点条件 ----------------
  xy_goal_tolerance: 1.50
  yaw_goal_tolerance: 3.14


  trans_stopped_vel: 0.25
  theta_stopped_vel: 0.12

  # trans_stopped_vel: 1.5
  # theta_stopped_vel: 0.25

  # ---------------- 轨迹预测 ----------------
  # 不再单纯通过超长预测距离承担制动安全。
  sim_time: 3.0   # 2026-07-29 2.2->3.0: 室内0.8m/s下前瞻2.4m, 局部轨迹更完整(贴障更保守可接受)
  sim_granularity: 0.06        # 0.03相对0.1m格是3倍过采样(36万次footprint评估/s纯浪费)
  angular_sim_granularity: 0.06

  # 适合8～10Hz，降低计算负担。
  vx_samples: 12
  vy_samples: 1
  vth_samples: 41

  # ---------------- 轨迹评分 ----------------
  # 允许更明显地离开穿过障碍的全局直线路径。
  path_distance_bias: 30.0
  goal_distance_bias: 18.0
  occdist_scale: 0.28  # 2026-07-30 0.22→0.28(DWA 仍贴障): 配合局部膨胀 1.0→1.5 对齐全局
                       # (免费滑移区归零)后, 再压转弯抄内侧(goal_bias 把轨迹拉向弯内=障碍侧)。
                       # 历史: 0.15(7-29审计)→0.22→0.28。
                       # 注意: 过高拒进窄缝——室内窄通道若犹豫, 室内档可回 0.15~0.22

  # 保留少量前视引导，但避免0.30造成过度回正。
  forward_point_distance: 0.30  # 转向对准梯度的来源, 设0会让掉头决策犹豫(2026-07-29定稿)

  # 可以保留，但不能依靠它代替距离限速。
  stop_time_buffer: 1.00  # 2026-07-30 0.8→1.0: 轨迹必须能在碰撞前 1s 停住(2m/s"来不及刹"配套)

  # 2026-07-30 启用"速度换胖身"(DWA内建, 之前几乎没启用): >1.0m/s 的轨迹用
  # 放大的 footprint 做碰撞检查, 2.0m/s 时放大 50%(0.80×0.70→1.2×1.05)——
  # 快轨迹在障碍附近先死、慢轨迹存活 → DWA 随距离自然降速。
  # 这是 DWA 端唯一的"速度×距离"耦合, 与限速器(走廊物理账)双保险。
  scaling_speed: 1.00
  max_scaling_factor: 0.50

  # 选定一侧后，不要太快解除振荡方向约束。
  oscillation_reset_dist: 0.6
  oscillation_reset_angle: 0.8

  twirling_scale: 0.00   # 2026-07-29 1.0→0(审查P1-5): 它线性惩罚|vth|=反奖励快转,
                         # 是掉头爬行的评分元凶; DWA已有occdist/oscillation约束旋转
  prune_plan: false

  publish_traj_pc: false
  publish_cost_grid_pc: false

  latch_xy_goal_tolerance: true
