# 雷达高程图避障适配节点参数（lidar_obstacle_scan_node.py）
# 对照文档：LIDAR_AVOIDANCE_VS_VISION_README_CN.md

# ---- 输入/输出 ----
elevation_topic: /elevation_mapping/elevation_map_raw   # 高程图（FAST-LIO odom 树, ~5Hz）
scan_topic: /r300_lidar/obstacle_scan                    # 输出虚拟激光（对齐视觉链契约）
debug_cloud_topic: /r300_lidar/obstacle_points           # 调试点云（rviz/web 用）
publish_debug_cloud: true

# ---- FAST-LIO 树内 frame（勿改成 1X 树的帧！两树同名 odom 不可跨查）----
lio_map_frame: odom
lio_body_frame: body
output_frame: base_link          # 仅作为输出 frame_id 字符串（1X 树语义）

# ---- 雷达安装外参（车体系: x前 y左）----
# 2026-07-27 用户口述"雷达装在车头中间"：车体 0.9×0.7m、base_link 在几何中心
# → ext_x 估计 0.40m（车头略内侧）、横向居中、朝前。±0.1m 误差对避障足够
# （膨胀半径 0.65m 兜底）；精化方法见对照文档"外参标定"节。
ext_x: 0.40
ext_y: 0.0
ext_yaw_deg: 0.0

# ---- 地形判定（v3 语义）----
drop_thresh: 0.25               # 负障碍阈值。2026-07-29 0.4→0.25: 现场调到0.4是被"数据接缝伪障"
                                #  逼的(根源已由 edge_erosion 侵蚀守卫解决); 0.4 会漏掉恰好0.4m深的
                                #  水坑, 0.25 保住水坑检测且草噪(<20cm)仍压得住
pos_thresh: 0.2                 # 2026-07-30 室外 0.15→0.2: erosion 降为1层后远距标记恢复,
                                #  草地/地表起伏 >15cm 的假正障碍随之出现, 回 0.2 压草噪。
                                #  代价: 矮障碍(躺平轮胎沿)敏感度降低——室内/无草场地可回 0.15
edge_erosion: 1                 # 2026-07-30 室外实测 3→1【"碰到才感知"根因】: 远距障碍只被打到
                                #  立面(1~2格薄线, 背后是阴影无数据), 3层侵蚀要求7×7全有效邻域,
                                #  把薄线整条吃光——实测按距离带: 4-5m 917个正障碍候选格侵蚀3层
                                #  后仅剩9个(99%被杀), 侵蚀1层留353个; 有效格密度随距离 93%→36%,
                                #  远处凑不齐7×7。伪障抑制职责移交 pos_confirm 3帧世界格确认
                                #  (行驶中数据前沿随车移动, 伪障格在世界系不驻留, 三帧自然杀掉)。
                                #  2026-07-29 室内近距的账(伪正障碍-91%)在远距不成立
max_height: 4.5                  # 高于此值视为天花板/横梁，不算障碍
slope_thresh_deg: 30.0           # 几何陡坡上限（24cm 基线中心差分）
min_range: 0.60                  # 车体半对角 0.57m，避免把自车格当障碍
max_range: 7.5                   # 高程图 16m 图有效半径内（2026-07-27 随 map_length 12→16 联动 5.5→7.5）
ground_ring_min: 0.60            # 局部地面环带（中位数=地面基准）
ground_ring_max: 1.60
ground_ring_min_cells: 30
sensor_height_above_ground: 0.48 # 环带不足时的几何地面退路（2026-07-27 实测）
neg_confirm: 3                   # 负障碍连续 3 帧确认（高程图 10Hz 下 0.3s）
pos_confirm: 2                   # 2026-07-30 晚 3→2(2m/s"发现晚"账): 草噪已由 pos_thresh 0.2 承担,
                                 #  3帧确认在远距稀疏命中下代价过高; 伪障残余靠 confirm_miss_decay
                                 #  的非对称衰减(伪障不驻留世界格, 0.5衰减2帧内清除)
confirm_miss_decay: 0.5          # 2026-07-30【"发现晚"主修复】: 非重复扫描下远处格每帧命中率~50%,
                                 #  原衰减1.0使确认计数 +1,-1 永久震荡(结构性无法确认, 只能等到
                                 #  近处命中率→100%); 0.5 让 50% 命中率 ~0.5s 内确认

# ---- 快反层(2026-07-30): 点云直通, 与高程图通道并联(不替换!) ----
# 正障碍: /cloud_registered_body 单帧直达 scan(≈0.15s 首现, 绕过卡尔曼+去抖),
#   探测半径 9m(不受高程图 16m 地图限制, 零 GPU 代价);
# 负障碍/坡度/侧后记忆/地面验证限速: 仍由高程图通道全权负责(坑无法单帧判定)。
# 两路逐束取最小值合并进同一根虚拟激光。
fast_layer_enable: true
fast_min_height: 0.30            # 快反层判障高度(比 pos_thresh 0.2 高一档: 单帧无确认,
                                 #  用高度换鲁棒, 30cm 以下矮障碍仍由高程图通道兜)
fast_min_points: 3               # 密度门槛: 同一角度束×0.25m距离桶内≥3点才算数(防雨尘/草尖)
fast_max_range: 9.0              # 快反层探测半径(点云可达, 与高程图 7.5 无关)
fast_cloud_timeout_s: 0.3        # 点云过龄不用(防陈旧帧)

# ---- 虚拟扫描布局（对齐 vision_obstacle_layer_node 输出契约）----
scan_fov_deg: 360.0              # 2026-07-29 120→360: MID360物理覆盖≈前向±100°且高程图带记忆,
                                 #  ±60°是自设瓶颈——切掉了侧向实时数据和侧后地图记忆,
                                 #  转弯/倒车失忆一半源于此。放开360°=把记忆当"软后雷达"用
scan_angle_increment_deg: 0.5
scan_range_min_m: 0.20
scan_range_max_m: 10.5
range_safety_margin_m: 0.0       # 2026-07-30 0.05→0(缝隙通行, 审查增胖链第2位): margin把标记
                                 #  朝车方向平移=每条缝两侧各吃5cm; 时间戳修复后标记已准,
                                 #  缓冲全权交给膨胀层。历史: 0.15→0.05(2026-07-29, 15cm前移
                                 #  曾把致命格塞进车头footprint造成死锁)→0
input_timeout_s: 2.0             # 高程图断流告警阈值（断流即停发, 下游 TTL 清空 + 限速压至下限）

# ---- 幽灵污染根治两件套（2026-07-29, 实测42%车周致命格为行人残影且~30分钟复发）----
pos_memory_ttl_s: 20.0           # 正障碍记忆寿命: 超过20s没被再次真实观测的障碍格不再进scan
                                 #  (真墙在视场内持续刷新不受影响; 转弯秒级侧后记忆保留)
pos_memory_ttl_near_s: 60.0      # 2026-07-30 近环分段记忆(审查): 0.6~near_ring 环带结构性
                                 #  无法被再次观测(前向最近真实回波~0.94m), 障碍前静止>20s
                                 #  会"过期蒸发→起步撞", 该环带给长记忆; 环带外保持 20s
                                 #  防行人残影(勿整体放大——幽灵实测正是室内场景)
near_ring_m: 1.2                 # 长记忆环带外半径(以 base_link 计; 内界=min_range 0.6)
neg_memory_ttl_s: 60.0           # 负障碍(坑)记忆寿命: 坑不会走路, 给更长
enable_auto_unstick: true        # 自动脱困: DWA已放弃+车尾走廊高程图验证干净+静止+无活动目标
                                 #  → 自动倒车(footprint陷入致命区后DWA连倒车轨迹都拒绝,
                                 #  这是唯一自救路径; 车尾不净由盲倒兜底接手)。每个被放弃的
                                 #  目标只救一次, 成败都不重试("被顶住"与急停无法区分);
                                 #  executor 重试发新 goal_id = 新救援额度, 链式可累计后退
unstick_reverse_m: 0.8           # 2026-07-30 比赛档 0.4→0.8(操作员定): 车尾走廊验证到 -1.7m,
                                 #  尾部 -0.40 倒足 0.8 后到 -1.2 仍在验证区; 0.25m/s 闭环,
                                 #  拍数上限自动按距离放大(6s)。已知限界: 尾后 0.45~0.6m
                                 #  环带在 min_range 盲区内, 细障碍不可见——知情风险
unstick_cooldown_s: 8.0          # 2026-07-30 15→8: "每个目标只救一次"上线后防刷屏职责已由
                                 #  goal_id 边沿承担, 冷却只需覆盖单次反射时长; 15s 曾造成
                                 #  连续两次失败时第二次得不到救援(审查 info 项)
unstick_blind_after_s: 60.0      # 盲倒兜底(2026-07-30 P1-2): 车尾无法验证时正常脱困拒绝出手,
                                 #  footprint 又陷致命区=永久冻结。位移<0.3m 持续超本值秒数
                                 #  且 move_base 仍在反复放弃 → 半速(0.15)盲倒
unstick_blind_reverse_m: 0.5     # 盲倒距离(操作员定 0.25→0.5): 知情风险——尾后可能有未观测
                                 #  细障碍, 比赛哲学: 慢速小碰撞 < 卡死的确定损失。冷却 60s

# ---- 水坑/无回波空洞 → 虚拟障碍（2026-07-30 P0-1）----
# 负障碍通道只能标"看得见的深", 水面无回波全盲; 限速器只减速不禁止(下限0.3),
# 车会以 0.3 爬进水坑。本机制把"持续无回波的近距空洞"当墙标进代价地图:
# 全局绕线/DWA否决/胡萝卜投影避开, 限速器退居第二道。
# 从严四条件防假墙: 前方扇区内 + 近距 + 该束更近处无障碍(墙的阴影不算洞) +
# 连续 N 帧无效(真地面几帧内就会被扫描填格, 只有水面/强吸收面驻留)。
hole_as_obstacle: true
hole_confirm_frames: 8           # 连续无效帧数(10Hz→0.8s); 起步建图瞬态不会误触发,
                                 #  因为真地面 0.8s 内必被填格, 填格即除名
hole_max_range_m: 4.0            # 只在近距确认(近距的地面若真实存在, 必然已被扫到)
hole_sector_half_deg: 75.0       # 前方扇区半角(确认窗口; 已确认格 360° 持续入束)
hole_memory_ttl_s: 60.0          # 与负障碍同寿命(水坑不会走)

# ---- 第三招：地面确认限速（不要开得比验证过的地面更快）----
# 原理: 坑的探测距离几何定死(d≈3.2×坑宽), 与其"更早看见坑"不如"只在验证过的
# 地面上放开速度"。前方走廊切片统计有效地面 → 连续验证距离 D →
# v = -a·t_r + sqrt((a·t_r)²+2a·(D-余量)), 经 dynamic_reconfigure 压 DWA。
enable_ground_speed_limit: true  # 总开关: 计算 D 并发布 /r300_lidar/ground_speed_limit
speed_limit_apply_to_dwa: true   # 执行开关(2026-07-28 现场已打开接管): 写 /move_base/DWAPlannerROS 的
                                 # max_vel_x/max_vel_trans。接管期间 dwa yaml 的 max_vel 只是初值,
                                 # 真上限= speed_limit_v_max。要退回"纯观测影子模式"改 false
                                 # (车速即回落 dwa yaml 静态值)
speed_limit_ignore_positive: false  # 2026-07-30 选择性限速: true=正障碍(墙/桩)不触发限速,
                                 # 墙全权交 DWA+快反层(0.15s/9m, 2m/s 裕度5倍), 只有
                                 # 坑/陡坡/无数据空洞(水坑!)减速——负障碍可见距离被遮挡
                                 # 几何限死(1.9×坑宽), 空洞记账让减速在7.5m内提前发生,
                                 # 也是水坑(无回波)唯一保护。本值是基准(旧语义);
                                 # 室外档由 launch 覆盖为 true, 室内档保持 false(窄环境
                                 # 墙前减速是防撞账一部分)。代价: 走廊内草噪假正障碍
                                 # 会临时短路其后方的空洞保护(已有双去抖压制)
speed_limit_v_max: 2.0           # 放开上限(2026-07-28 1.5→2.5)。开阔地自动跑满, 坑区/未验证地面自动降;
                                 # 限速接管后 dwa yaml 的 max_vel(1.5) 只是初值兼保底——
                                 # 关掉本功能即回落 1.5。GR3D/10Hz/水坑三关验收仍需在实车完成
speed_limit_v_min: 0.3           # 下限: 保证起步能建图、感知失效时的爬行速度
speed_limit_brake_acc: 1.74      # 2026-07-30 实车实测回填(brake_test.sh: 1.53m/s急停, 拟合
                                 #  a=2.18m/s², 41样本) × 0.8 安全系数 = 1.74。同时验证了
                                 #  dwa acc_lim_x=2.0 ≤ 实测2.18, 两本账首次同源闭合。
                                 #  注意: 实测面为当日室外场地, 换泥地/湿地需重测(brake_test.sh GO)
speed_limit_react_time: 0.5      # 2026-07-29 0.3→0.5(审查P0-3): 0.3按"DWA 8Hz"预算, 实际
                                 # controller 5Hz(周期0.2s)+costmap 7Hz+底盘响应, 0.3不够
speed_limit_margin: 1.2          # 2026-07-30 1.45→1.2(2m/s提速账, 按分解重导): 车头到保险杠 0.40
                                 #  + D量化(cor_bin) 0.25 + erosion轮廓缩减 0.04(3层时是0.12)
                                 #  + 停稳缓冲 0.5 ≈ 1.2。原 1.45 的注释推导(0.45+0.3=0.75)早已断裂
corridor_half_width: 0.45        # 走廊半宽 = footprint 半宽 0.35 + 0.10
corridor_start: 0.7              # 验证起点(距 base_link, ≥高程图 min_range 0.6)
corridor_bin: 0.25               # 走廊纵向切片长度
corridor_min_ground_frac: 0.3    # 切片内有效地面格比例门槛(容忍远处回波稀疏)
corridor_min_ground_cells: 8     # 切片内有效地面格最少数

