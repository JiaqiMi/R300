# 雷达高程图避障适配节点参数（lidar_obstacle_scan_node.py）
# 对照文档：LIDAR_AVOIDANCE_VS_VISION_README_CN.md

# ---- 输入/输出 ----
elevation_topic: /elevation_mapping/elevation_map_raw   # 高程图（FAST-LIO odom 树, ~5Hz）
scan_topic: /r300_lidar/obstacle_scan                    # 输出虚拟激光（对齐视觉链契约）
debug_cloud_topic: /r300_lidar/obstacle_points           # 调试点云（rviz/web 用）
publish_debug_cloud: true

# ---- FAST-LIO 树内 frame（勿改成 1X 树的帧！两树同名 odom 不可跨查）----
lio_map_frame: odom
lio_body_frame: body
output_frame: base_link          # 仅作为输出 frame_id 字符串（1X 树语义）

# ---- 雷达安装外参（车体系: x前 y左）----
# 2026-07-27 用户口述"雷达装在车头中间"：车体 0.9×0.7m、base_link 在几何中心
# → ext_x 估计 0.40m（车头略内侧）、横向居中、朝前。±0.1m 误差对避障足够
# （膨胀半径 0.65m 兜底）；精化方法见对照文档"外参标定"节。
ext_x: 0.40
ext_y: 0.0
ext_yaw_deg: 0.0

# ---- 地形判定（v3 语义）----
drop_thresh: 0.15               # 负障碍：低于局部地面 15cm（坑/沟沿）
pos_thresh: 0.15                 # 正障碍：高于局部地面 15cm
max_height: 4.5                  # 高于此值视为天花板/横梁，不算障碍
slope_thresh_deg: 30.0           # 几何陡坡上限（24cm 基线中心差分）
min_range: 0.60                  # 车体半对角 0.57m，避免把自车格当障碍
max_range: 7.5                   # 高程图 16m 图有效半径内（2026-07-27 随 map_length 12→16 联动 5.5→7.5）
ground_ring_min: 0.60            # 局部地面环带（中位数=地面基准）
ground_ring_max: 1.60
ground_ring_min_cells: 30
sensor_height_above_ground: 0.48 # 环带不足时的几何地面退路（2026-07-27 实测）
neg_confirm: 3                   # 负障碍连续 3 帧确认（高程图 10Hz 下 0.3s）
pos_confirm: 2

# ---- 虚拟扫描布局（对齐 vision_obstacle_layer_node 输出契约）----
scan_fov_deg: 120.0              # ±60°（视觉链只有 ±27°）
scan_angle_increment_deg: 0.5
scan_range_min_m: 0.20
scan_range_max_m: 10.5
range_safety_margin_m: 0.15      # 束距离前移安全余量（视觉链为 0.2）
input_timeout_s: 2.0             # 高程图断流告警阈值（断流即停发, 下游 TTL 清空 + 限速压至下限）

# ---- 第三招：地面确认限速（不要开得比验证过的地面更快）----
# 原理: 坑的探测距离几何定死(d≈3.2×坑宽), 与其"更早看见坑"不如"只在验证过的
# 地面上放开速度"。前方走廊切片统计有效地面 → 连续验证距离 D →
# v = -a·t_r + sqrt((a·t_r)²+2a·(D-余量)), 经 dynamic_reconfigure 压 DWA。
enable_ground_speed_limit: true  # 总开关: 计算 D 并发布 /r300_lidar/ground_speed_limit
speed_limit_apply_to_dwa: false  # 执行开关: 写 /move_base/DWAPlannerROS 的 max_vel_x/max_vel_trans
                                 # ★当前=影子模式(2026-07-28): 只发 /r300_lidar/ground_speed_limit 观测、
                                 # 不干预 DWA——先单独验证感知提速(延迟~1s/探测7.5m)的避障效果,
                                 # 车速此时由 subject1_dwa_lidar.yaml 的 max_vel_x/max_vel_trans 决定(现 1.5,
                                 # 提速测试直接改那里); 影子数值合格后再把本开关置 true 接管
speed_limit_v_max: 2.5           # 放开上限(2026-07-28 1.5→2.5)。开阔地自动跑满, 坑区/未验证地面自动降;
                                 # 限速接管后 dwa yaml 的 max_vel(1.5) 只是初值兼保底——
                                 # 关掉本功能即回落 1.5。GR3D/10Hz/水坑三关验收仍需在实车完成
speed_limit_v_min: 0.3           # 下限: 保证起步能建图、感知失效时的爬行速度
speed_limit_brake_acc: 1.0       # 制动加速度, 与 subject1_dwa_lidar 的 acc_lim_x 一致
speed_limit_react_time: 0.5      # 指令生效延迟预算 s（DWA 8Hz + 底盘响应）
speed_limit_margin: 0.75         # 停车余量 = 车头 0.45 + 缓冲 0.3
corridor_half_width: 0.45        # 走廊半宽 = footprint 半宽 0.35 + 0.10
corridor_start: 0.7              # 验证起点(距 base_link, ≥高程图 min_range 0.6)
corridor_bin: 0.25               # 走廊纵向切片长度
corridor_min_ground_frac: 0.3    # 切片内有效地面格比例门槛(容忍远处回波稀疏)
corridor_min_ground_cells: 8     # 切片内有效地面格最少数
