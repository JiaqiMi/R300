# ============================================================
# R300 即时自主泊车
#
# 唯一触发条件：
#   parking_empty 置信度 >= 0.20，连续 5 个不同检测帧有效。
# 第 5 帧后立即：
#   1. 发布 parking_target / target_fix / target_pose；
#   2. 取消旧 move_base 目标；
#   3. 将停车点直接交给 move_base。
#
# 不依赖 waypoint_status，不等待 park，不检查 occupied，不要求车辆静止，
# 不旋转搜索，不修改 DWA 或其他控制参数。
# ============================================================

goal_frame: map
base_frame: base_link
move_base_action: /move_base
fix_topic: /one_x/fix
heading_topic: /one_x/heading_deg
parking_detections_topic: /r300_parking_vision/detections
pause_waypoints_service: /subject1/pause_waypoints

# 必须严格满足的触发条件。
empty_class_name: parking_empty
min_empty_confidence: 0.20
required_frames: 5

# “连续同一个目标”的最小保护。任一帧无有效 empty 会立即清零。
max_frame_gap_s: 1.0
max_target_jump_m: 1.5
min_target_depth_m: 0.40
max_target_depth_m: 15.0

# /one_x/fix 和 /one_x/heading_deg 必须是新鲜有效数据。
navigation_data_freshness_s: 1.5
reject_zero_fix: true

# 只负责把目标交给已有 move_base，不修改规划器参数。
move_base_wait_s: 15.0
parking_goal_timeout_s: 60.0

# 相机/独立检测节点自动复用或自动启动。
rgb_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
parking_annotated_topic: /r300_parking_vision/annotated_image
parking_target_point_topic: /r300_parking_vision/target_point

camera_freshness_s: 1.5
camera_probe_s: 2.0
camera_start_timeout_s: 20.0
detector_start_timeout_s: 45.0
detections_freshness_s: 1.0
auto_start_camera: true
auto_start_parking_detector: true

camera_serial_no: ""
camera_device_type: d435i
camera_initial_reset: false
camera_width: 640
camera_height: 480
camera_fps: 30

# 仅独立检测进程自动启动时使用。已有检测话题时不会重复启动。
model1_path: ""
model2_path: ""
parking_detector_config: ""

# 相机与惯导安装误差及杆臂按要求固定为 0。
# 控制节点只执行必要的坐标轴定义转换：光学系 x右/y下/z前 -> 车体前/右。
