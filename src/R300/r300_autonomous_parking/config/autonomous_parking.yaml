# ============================================================
# R300 航点完成后自主泊车
#
# 集成到雷达导航时：
#   1. 等待 /subject1/waypoint_status 中 state=COMPLETED；
#   2. 复用/启动 D435i，并通过 R300_vision/parking_yolo_depth.launch
#      启动独立停车框识别；
#   3. 车辆仅正向原地旋转，每 30°停留 5s，并持续循环巡视；
#   4. parking_empty 置信度 >=0.20 且连续5帧稳定后，发布唯一停车点；
#   5. 立即停止巡视，并把同一停车点作为一次性 move_base 新目标。
#
# 到达停车点后保持 FINISHED，不自动重新布防，不重复巡视。
# ============================================================

goal_frame: map
base_frame: base_link
move_base_action: /move_base
fix_topic: /one_x/fix
heading_topic: /one_x/heading_deg
parking_detections_topic: /r300_parking_vision/detections
pause_waypoints_service: /subject1/pause_waypoints

# 雷达导航通过 launch 覆盖为 true；独立启动保持 false，兼容原来的立即识别模式。
wait_for_waypoint_completion: false
waypoint_status_topic: /subject1/waypoint_status

# 航点完成后的原地巡视。雷达导航 launch 覆盖为 true；独立泊车保持 false。
search_enabled: false
search_cmd_vel_topic: /subject1/cmd_vel_raw
search_step_deg: 30.0
search_hold_s: 5.0
# true：不限圈数，直到 parking_empty 连续稳定并生成停车任务后才停止。
# false：仅执行 search_cycles 圈，保留给台架/单元测试。
search_continuous: true
search_cycles: 1
search_angular_speed_radps: 0.25
search_min_angular_speed_radps: 0.08
search_yaw_kp: 1.2
search_yaw_tolerance_deg: 2.0
search_control_hz: 20.0
search_step_timeout_s: 10.0

# 必须严格满足的触发条件。
empty_class_name: parking_empty
min_empty_confidence: 0.3
required_frames: 5

# “连续同一个目标”的最小保护。任一帧无有效 empty 会立即清零。
max_frame_gap_s: 1.0
max_target_jump_m: 1.5
min_target_depth_m: 0.40
max_target_depth_m: 15.0

# /one_x/fix 和 /one_x/heading_deg 必须是新鲜有效数据。
navigation_data_freshness_s: 1.5
reject_zero_fix: true

# 最终停车目标仍交给已有 move_base，但在该目标生命周期内临时收紧
# DWA 的 xy_goal_tolerance；普通 GPS 航点阶段原有容差不受影响。
move_base_wait_s: 15.0
parking_goal_timeout_s: 60.0
dwa_reconfigure_namespace: /move_base/DWAPlannerROS
parking_xy_goal_tolerance_m: 0.30
dwa_reconfigure_timeout_s: 3.0
restore_dwa_goal_tolerance_after_parking: true

# 最终停车目标发送给 move_base 前，临时缩小雷达障碍膨胀层。
# 同时修改局部层(DWA)和全局层(Navfn)，否则只改一层仍可能出现
# “全局无路”或“全局有路但局部不肯进入停车位”。普通航点和30°巡视阶段
# 保持原膨胀参数；停车成功、失败、超时、reset或节点退出后恢复原值。
parking_inflation_enabled: true
parking_inflation_reconfigure_namespaces:
  - /move_base/local_costmap/inflation_layer
  - /move_base/global_costmap/inflation_layer
parking_inflation_radius_m: 0.30
inflation_reconfigure_timeout_s: 3.0
parking_inflation_settle_s: 0.50
restore_inflation_after_parking: true

# 相机/独立检测节点自动复用或自动启动。
rgb_topic: /camera/color/image_raw
depth_topic: /camera/aligned_depth_to_color/image_raw
camera_info_topic: /camera/color/camera_info
parking_annotated_topic: /r300_parking_vision/annotated_image
parking_target_point_topic: /r300_parking_vision/target_point

camera_freshness_s: 1.5
camera_probe_s: 2.0
camera_start_timeout_s: 20.0
detector_start_timeout_s: 45.0
detections_freshness_s: 1.0
auto_start_camera: true
auto_start_parking_detector: true

# 航点完成进入泊车阶段时，关闭 start_r300.sh web 启动的常规双YOLO，
# 仅保留其父 launch 中的 D435i、Web 和轻量反馈节点，再加载停车识别模型。
# r300_system_dual.launch 已将该常规检测节点设为 non-required，确保 rosnode kill
# 不会连带关闭相机。
stop_regular_detector_before_parking: true
regular_detector_node: /r300_dual_yolo_depth_node
regular_detector_stop_timeout_s: 6.0
regular_detector_release_wait_s: 1.0

camera_serial_no: ""
camera_device_type: d435i
camera_initial_reset: false
camera_width: 640
camera_height: 480
camera_fps: 30

# 仅独立检测进程自动启动时使用。已有检测话题时不会重复启动。
model1_path: ""
model2_path: ""
parking_detector_config: ""

# 相机与惯导安装误差及杆臂按要求固定为 0。
# 控制节点只执行必要的坐标轴定义转换：光学系 x右/y下/z前 -> 车体前/右。
