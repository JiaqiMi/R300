# 单前雷达形态（use_back_lidar:=false）的高程图输入/输出
# 与 elevation_cart.yaml 唯一差别: 去掉 back_lidar 订阅。
# 架构: 前楔新鲜数据 + 地图记忆补侧后盲区(只前进场景成立, 依赖低漂移里程计)。
# 起步建议先原地慢转一圈(环视仪式), 把周围高程图和局部地面环带种满。
pointcloud_channel_fusions:
  rgb: 'color'
  default: 'average'

image_channel_fusions:
  rgb: 'color'
  default: 'exponential'

subscribers:
  front_lidar:
    topic_name: '/cloud_registered_body'
    data_type: pointcloud

# 2026-07-27 提速改造:
#   fps 5→10（配合 map_acquire_fps 10, 全链延迟 -0.1s）;
#   traversability 层不再发布（CNN 已由 enable_traversability:false 关闭, 避障用几何陡坡）;
#   elevation_map_filter/min_filter 发布器删除（v3 起弃用、全仓库无消费者;
#     min_filter 是插件, 无发布请求即不计算——省 GPU 零代码改动）。
publishers:
  elevation_map_raw:
    layers: ['elevation']
    basic_layers: ['elevation']
    fps: 10.0
