# 前雷达(FAST-LIO 输入)应急裁剪，仅 lio_input_crop:=true 时生效。
# 用途：裁掉随体移动的结构/线缆，避免污染 scan-to-map 配准。坐标为前雷达传感器系。
# 2026-07-27 重装后静置实测（车静止、雷达前倾 42.3°）：
#   r<0.3m 自体密集簇（13594 点/5 帧）bbox x[-0.194,0.105] y[-0.047,0.202] z[-0.010,0.198]
#     —— 已由 fastlio_mid360.yaml 的 blind:0.4 在内核级覆盖，min_range 只作双保险。
#   r 0.3~0.6m +y 侧小簇（~107 点/帧）bbox x[-0.405,0.271] y[0.215,0.572] z[-0.050,0.325]
#     —— 静止时无法区分"车体固定物"还是"环境物体"，盒子已按 +6cm 余量填入；
#        行驶复核：若 rviz 里该簇跟车走则保持启用，若是环境物体请删除此盒。
# 注意：本节点为 Python 逐点过滤，长期启用前先在板上确认输出仍能稳定 10Hz。
min_range: 0.35
boxes:
  - [-0.47, 0.34, 0.15, 0.64, -0.11, 0.39]
